      <line x1="94" y1="69" x2="132" y2="45"/>
      <line x1="98" y1="80" x2="136" y2="80"/>
      <line x1="94" y1="91" x2="132" y2="115"/>
    </g>

    <g fill="url(#wm-grad)">
      <circle cx="40" cy="86" r="17.5"/>

  <text x="202" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600" fill="#475569" letter-spacing="0.08em">CLOUD AGENTS FOR AI ASSISTANTS</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="AgentDispatch">
  <title>AgentDispatch</title>
  <defs>
    <linearGradient id="wmd-grad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wmd-text" x1="200" y1="80" x2="700" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="wmd-glow" cx="80" cy="80" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(10,10)">
    <rect width="160" height="160" rx="36" fill="#0B1020"/>
    <circle cx="80" cy="80" r="32" fill="url(#wmd-glow)"/>

    <g stroke="url(#wmd-grad)" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="80" y1="80" x2="24" y2="80"/>
      <line x1="80" y1="80" x2="128.5" y2="52"/>
      <line x1="80" y1="80" x2="128.5" y2="108"/>
    </g>

    <circle cx="24" cy="80" r="10" fill="#A78BFA"/>
    <circle cx="128.5" cy="52" r="10" fill="#22D3EE"/>
    <circle cx="128.5" cy="108" r="10" fill="#22D3EE"/>

    <circle cx="80" cy="80" r="18" fill="url(#wmd-grad)"/>
    <circle cx="80" cy="80" r="5" fill="#FFFFFF"/>
  </g>

  <text x="200" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC">Agent<tspan fill="url(#wmd-text)">Dispatch</tspan></text>
  <text x="202" y="142" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" letter-spacing="0.04em">PROVIDER-NEUTRAL RUNTIME FOR AI AGENTS</text>
</svg>

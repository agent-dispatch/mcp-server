<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AgentDispatch — spawn cloud agents from your AI">
  <title>AgentDispatch — spawn cloud agents from your AI</title>

  <rect width="1200" height="630" fill="#FAFAFA"/>

  <g transform="translate(80, 72) scale(0.65)">
    <rect width="200" height="200" rx="44" fill="#0A0A0A"/>
    <g fill="#FAFAFA">
      <circle cx="68" cy="104" r="22"/>
      <circle cx="100" cy="82" r="28"/>
      <circle cx="136" cy="100" r="24"/>
      <rect x="58" y="96" width="92" height="36" rx="18"/>
    </g>
    <path d="M 102 78 L 107 99 L 128 104 L 107 109 L 102 130 L 97 109 L 76 104 L 97 99 Z"
          fill="#0A0A0A"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" fill="#0A0A0A">
    <text x="220" y="148" font-size="38" font-weight="700" letter-spacing="-0.02em">AgentDispatch</text>

    <text x="80" y="300" font-size="80" font-weight="800" letter-spacing="-0.035em">Spawn cloud agents</text>
    <text x="80" y="394" font-size="80" font-weight="800" letter-spacing="-0.035em">from your AI.</text>

    <text x="80" y="468" font-size="26" font-weight="500" fill="#52525B">Claude Code, OpenClaw, and Hermes plan. AgentDispatch runs</text>
    <text x="80" y="504" font-size="26" font-weight="500" fill="#52525B">the marathon — on managed cloud compute.</text>
  </g>

  <line x1="80" y1="556" x2="1120" y2="556" stroke="#E4E4E7"/>
  <text x="80" y="588" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#71717A" letter-spacing="0.06em">GITHUB.COM/AGENT-DISPATCH</text>
  <text x="1120" y="588" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#FF5C00" letter-spacing="0.04em">spawn_cloud_agent()</text>
</svg>
